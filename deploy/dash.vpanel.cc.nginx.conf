server {
    listen 80;
    listen [::]:80;
    server_name dash.vpanel.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dash.vpanel.cc;

    ssl_certificate /etc/letsencrypt/live/dash.vpanel.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.vpanel.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/dash.vpanel.cc.access.log;
    error_log /var/log/nginx/dash.vpanel.cc.error.log;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /updates {
        return 301 /updates/;
    }

    location = /updates/update-manifest.json {
        alias /var/www/dashdesign-updates/update-manifest.json;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /updates/ {
        alias /var/www/dashdesign-updates/;
        autoindex off;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
